name: build radv

# Builds the AMD Vulkan driver only. The point is to check that patches on this
# fork still compile, and to get a libvulkan_radeon.so for aarch64 hosts without
# having to build Mesa on the machine that runs it.

on:
  push:
    branches: [main, 'gfx8*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            arch: aarch64
          - runner: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config python3-mako python3-pip \
            python3-yaml python3-setuptools bison flex \
            libdrm-dev libelf-dev libexpat1-dev zlib1g-dev \
            libwayland-dev wayland-protocols libwayland-egl-backend-dev \
            libx11-dev libxext-dev libxfixes-dev libxdamage-dev libxshmfence-dev \
            libxrandr-dev libxcb1-dev libx11-xcb-dev libxcb-dri2-0-dev \
            libxcb-dri3-dev libxcb-glx0-dev libxcb-present-dev libxcb-randr0-dev \
            libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev libxxf86vm-dev \
            glslang-tools

      - name: Install meson
        # Ubuntu 24.04 ships meson 1.3.2; Mesa needs >= 1.4.0.
        run: |
          python3 -m pip install --user --break-system-packages 'meson>=1.4'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          meson setup build \
            --buildtype=release \
            -Dallow-fallback-for=libdrm \
            -Dvulkan-drivers=amd \
            -Dgallium-drivers= \
            -Dplatforms=x11,wayland \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Dllvm=disabled \
            -Dvideo-codecs= \
            -Dbuild-tests=false

      - name: Build
        run: ninja -C build src/amd/vulkan/libvulkan_radeon.so

      - name: Collect
        run: |
          mkdir -p out
          cp build/src/amd/vulkan/libvulkan_radeon.so out/
          # An ICD manifest pointing at the library, for VK_DRIVER_FILES.
          cat > out/radeon_icd.json <<EOF
          {
            "ICD": {
              "api_version": "1.4.335",
              "library_arch": "64",
              "library_path": "./libvulkan_radeon.so"
            },
            "file_format_version": "1.0.1"
          }
          EOF
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: libvulkan_radeon-${{ matrix.arch }}
          path: out/
          retention-days: 30
